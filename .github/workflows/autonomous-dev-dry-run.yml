name: Autonomous development dry run

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Maintainer-authorized issue number (synthetic work only)
        required: true
        type: string
      base_sha:
        description: Exact current feat/alpaca-paper-foundation commit (40 lowercase hex)
        required: true
        type: string
      scenario:
        description: Fixture scenario; failures deliberately stop closed
        required: true
        default: happy
        type: choice
        options: [happy, repair-once, repair-cap, provider-failure, budget, stale-review, stale-ci, path-escape, control-path, ci-failure]
      resume_run_id:
        description: Optional completed run ID from this workflow/issue/base
        required: false
        default: ''
        type: string
      max_steps:
        description: Controller steps; use 3 to demonstrate partial-run resume
        required: true
        default: '50'
        type: string

permissions:
  contents: read
  issues: read
  actions: read

# A task owns the controller for its entire run. This is stricter than one
# implementer + one reviewer per (synthetic) PR. Do not cancel a journal writer.
concurrency:
  group: autonomous-dev-${{ github.repository }}-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  synthetic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TRADING_ENABLED: 'false'
      ALLOW_PAPER_ORDERS: 'false'
      ALPACA_LIVE_TRADE: 'false'
    steps:
      # No checkout-controlled executable runs before this inline bootstrap.
      - name: Validate trusted dispatch and snapshot GitHub issue
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REQUESTED_BASE: ${{ inputs.base_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
          MAX_STEPS: ${{ inputs.max_steps }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          def api(path):
              p = subprocess.run(['gh', 'api', path], capture_output=True)
              if p.returncode:
                  raise SystemExit('GITHUB_ACCESS_UNAVAILABLE')
              return json.loads(p.stdout)
          repo, base, issue = (os.environ[k] for k in ('REPOSITORY', 'REQUESTED_BASE', 'ISSUE_NUMBER'))
          if (repo != 'emanuel894/trading_agent'
              or not re.fullmatch(r'[0-9a-f]{40}', base)
              or not re.fullmatch(r'[1-9][0-9]{0,8}', issue)
              or os.environ['GITHUB_REF'] != 'refs/heads/feat/alpaca-paper-foundation'
              or os.environ['GITHUB_SHA'] != base
              or os.environ['WORKFLOW_SHA'] != base
              or not re.fullmatch(r'(?:[1-9]|[1-4][0-9]|50)', os.environ['MAX_STEPS'])
              or not re.fullmatch(r'(?:[1-9][0-9]*)?', os.environ['RESUME_RUN'])):
              raise SystemExit('UNTRUSTED_DISPATCH')
          if api(f'repos/{repo}/git/ref/heads/feat/alpaca-paper-foundation')['object']['sha'] != base:
              raise SystemExit('STALE_BASE_SHA')
          permission = api(f'repos/{repo}/collaborators/{os.environ["ACTOR"]}/permission')['permission']
          if permission not in ('admin', 'maintain', 'write'):
              raise SystemExit('MAINTAINER_REQUIRED')
          source = api(f'repos/{repo}/issues/{issue}')
          if source['number'] != int(issue) or source['state'] != 'open' or 'pull_request' in source:
              raise SystemExit('OPEN_ISSUE_REQUIRED')
          # Bind the snapshot without writing/logging untrusted issue text.
          raw = json.dumps({k: source[k] for k in ('number', 'title', 'body', 'updated_at')},
                           sort_keys=True, separators=(',', ':')).encode()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('issue_hash=' + hashlib.sha256(raw).hexdigest() + '\n')
          PY

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Run complete secretless acceptance tests
        working-directory: trading_agent_starter
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m agent demo --output "$RUNNER_TEMP/dev-loop-demo"

      - name: Restore trusted previous journal if requested
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'dev-loop-state'
          target.mkdir(exist_ok=True)
          task = os.environ['GITHUB_RUN_ID']
          previous = os.environ['RESUME_RUN']
          if previous:
              p = subprocess.run(['gh', 'api', f'repos/{os.environ["REPOSITORY"]}/actions/runs/{previous}'], capture_output=True)
              if p.returncode:
                  raise SystemExit('RESUME_RUN_UNAVAILABLE')
              run = json.loads(p.stdout)
              if (run['head_sha'] != os.environ['BASE_SHA'] or run['status'] != 'completed'
                  or run['path'] != '.github/workflows/autonomous-dev-dry-run.yml'
                  or run['head_branch'] != 'feat/alpaca-paper-foundation'
                  or run['event'] != 'workflow_dispatch'):
                  raise SystemExit('UNTRUSTED_RESUME_RUN')
              name = f'autonomous-dev-issue-{os.environ["ISSUE_NUMBER"]}-{previous}-{run["run_attempt"]}'
              p = subprocess.run(['gh', 'run', 'download', previous, '--repo', os.environ['REPOSITORY'],
                                  '--name', name, '--dir', str(target)], capture_output=True)
              if p.returncode:
                  raise SystemExit('RESUME_ARTIFACT_UNAVAILABLE')
              state = target/'state.json'
              if state.is_symlink() or not state.is_file() or state.stat().st_size > 1000000:
                  raise SystemExit('INVALID_RESUME_ARTIFACT')
              task = json.loads(state.read_text())['task']['run_id']
          if not isinstance(task, str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,80}', task):
              raise SystemExit('INVALID_TASK_ID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('task_id=' + task + '\n')
          PY

      - name: Run synthetic worker, CI, reviewer and bounded repairs
        working-directory: trading_agent_starter
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SCENARIO: ${{ inputs.scenario }}
          MAX_STEPS: ${{ inputs.max_steps }}
          TASK_ID: ${{ steps.resume.outputs.task_id }}
          ISSUE_HASH: ${{ steps.trust.outputs.issue_hash }}
        run: |
          python -m devloop --base-sha "$BASE_SHA" --issue-number "$ISSUE_NUMBER" \
            --scenario "$SCENARIO" --task-id "$TASK_ID" --issue-snapshot-hash "$ISSUE_HASH" \
            --max-steps "$MAX_STEPS" --output "$RUNNER_TEMP/dev-loop-state"

      - name: Publish synthetic journal and summary
        if: always() && steps.resume.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomous-dev-issue-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-loop-state/state.json
            ${{ runner.temp }}/dev-loop-state/summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Display auditable synthetic state transitions
        if: always() && steps.resume.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'dev-loop-state/state.json'
          if path.exists():
              record = json.loads(path.read_text())
              states = [e['snapshot']['state'] for e in record['events']]
              states = [s for i, s in enumerate(states) if i == 0 or s != states[i-1]]
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Synthetic development loop\n\n')
                  f.write('No real PR, independent model review, broker or data call was performed.\n\n')
                  f.write(' → '.join(states) + '\n\n')
                  f.write('State: ' + record['snapshot']['state'] + '; repairs: '
                          + str(record['snapshot']['repair_cycles']) + '/2. Human merge remains mandatory.\n')
          PY
